name: Render programme PDF

on:
  push:
    paths:
      - README.md
      - nicerPDF/programme_pdf.R
      - nicerPDF/programme.css
      - nicerPDF/install_packages.R
      - BookOfAbstracts/book_abstracts_pdf.R
      - BookOfAbstracts/read_submissions.R
      - abstracts.csv
      - .github/workflows/render-pdf.yml
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install R dependencies
        run: |
          Rscript nicerPDF/install_packages.R

      - name: Render programme PDF
        run: Rscript nicerPDF/programme_pdf.R README.md uros2026_programme.pdf

      - name: Render BoC PDF
        run: Rscript BookOfAbstracts/book_abstracts_pdf.R abstracts.csv uros2026_book_of_abstracts.pdf

      - name: Commit and push PDFs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add uros2026_programme.pdf uros2026_book_of_abstracts.pdf
          git commit -m "Update PDF files [skip ci]" || echo "No changes to commit"
          git push
