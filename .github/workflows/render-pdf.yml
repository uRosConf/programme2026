name: Render programme PDF

on:
  push:
    paths:
      - README.md
      - nicerPDF/programme_pdf.R
      - nicerPDF/programme.css
      - nicerPDF/install_packages.R
      - .github/workflows/render-pdf.yml
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install R dependencies
        run: Rscript install_packages.R

      - name: Render PDF
        run: Rscript nicerPDF/programme_pdf.R README.md uros2026_programme.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: uRos-programme
          path: uros2026_programme.pdf
